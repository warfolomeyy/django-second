{% extends 'base.html' %}

{% block content %}
<h1>Удаление заявки</h1>
<p>Вы действительно хотите удалить заявку <b>«{{ app.title }}»</b>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'profile' %}" style="margin-left: 10px;">Отмена</a>
</form>
{% endblock %}
