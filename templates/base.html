<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Design.pro</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 15px; color: #222; }
        nav { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #333; }
        nav a { text-decoration: none; color: #0056b3; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .nav-user { margin-left: auto; }
        .errorlist { color: #c00; margin: 4px 0; padding-left: 18px; font-size: 13px; }
        .field-error input, .field-error select, .field-error textarea { border: 2px solid #c00; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea { padding: 6px 8px; border: 1px solid #aaa; border-radius: 4px; width: 100%; max-width: 400px; box-sizing: border-box; }
        button { padding: 7px 14px; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        table { border-collapse: collapse; width: 100%; margin-top: 12px; }
        th, td { border: 1px solid #ccc; padding: 9px 10px; text-align: left; vertical-align: top; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'index' %}">Главная</a>
    {% if user.is_authenticated %}
    {% if user.is_staff %}
    <a href="{% url 'admin_dashboard' %}">Панель администратора</a>
    <a href="/superadmin/">Django Admin</a>
    {% else %}
    <a href="{% url 'profile' %}">Мои заявки</a>
    <a href="{% url 'create_app' %}">Создать заявку</a>
    {% endif %}
    <span class="nav-user">Вы вошли как: <b>{{ user.username }}</b> | <a href="{% url 'logout' %}">Выход</a></span>
    {% else %}
    <a href="{% url 'login' %}">Вход</a>
    <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</nav>

{% block content %}{% endblock %}
</body>
</html>
