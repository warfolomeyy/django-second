<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Design.pro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
        nav a { margin-right: 15px; }
        .errorlist { color: red; margin: 4px 0; padding-left: 20px; }
        .field-error input, .field-error select, .field-error textarea { border: 2px solid red; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'index' %}">Главная</a>
    {% if user.is_authenticated %}
    {% if user.is_staff %}
    <a href="{% url 'admin_dashboard' %}">Панель администратора</a>
    <a href="/superadmin/">Django Admin</a>
    {% else %}
    <a href="{% url 'profile' %}">Мои заявки</a>
    <a href="{% url 'create_app' %}">Создать заявку</a>
    {% endif %}
    <span>Вы вошли как: <b>{{ user.username }}</b></span>
    <a href="{% url 'logout' %}" style="margin-left: 15px;">Выход</a>
    {% else %}
    <a href="{% url 'login' %}">Вход</a>
    <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</nav>

{% block content %}{% endblock %}
</body>
</html>
