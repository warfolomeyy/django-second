{% extends 'base.html' %}

{% block content %}
<h1>Вход</h1>
{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <p>
        <label>Логин:</label><br>
        <input type="text" name="username" required>
    </p>
    <p>
        <label>Пароль:</label><br>
        <input type="password" name="password" required>
    </p>
    <button type="submit">Войти</button>
</form>
{% endblock %}
